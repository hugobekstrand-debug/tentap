<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tentaplugget – tester</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="tests" id="app">
      <header class="tests-head">
        <h1>Tester för igenkänningen</h1>
        <p class="muted">
          Kör textlayer.js, detect.js och crop.js mot konstruerade textrader. Inget nätverk, ingen API-nyckel och inga
          riktiga tentor behövs. Samma tester körs i terminalen med <code>node tests/run-node.mjs</code>.
        </p>
        <p class="tests-summary" id="summary" role="status" aria-live="polite">Kör testerna…</p>
      </header>
      <ol class="tests-list" id="list"></ol>
    </main>
    <script type="module">
      import { runAll } from './tests/suite.js';
      const list = document.getElementById('list');
      const summary = document.getElementById('summary');
      let results;
      try {
        results = runAll();
      } catch (err) {
        summary.textContent = `Testerna kunde inte köras: ${err.message}`;
        summary.className = 'tests-summary is-fail';
        throw err;
      }
      let group = null;
      for (const r of results) {
        if (r.group !== group) {
          group = r.group;
          const h = document.createElement('li');
          h.className = 'tests-group';
          h.textContent = group;
          list.append(h);
        }
        const li = document.createElement('li');
        li.className = `tests-item ${r.ok ? 'is-pass' : 'is-fail'}`;
        const badge = document.createElement('span');
        badge.className = `badge ${r.ok ? 'badge--klar' : 'badge--fel'}`;
        badge.textContent = r.ok ? 'Godkänt' : 'Underkänt';
        const name = document.createElement('span');
        name.className = 'tests-name';
        name.textContent = r.name;
        li.append(badge, name);
        if (!r.ok) {
          const err = document.createElement('p');
          err.className = 'tests-error';
          err.textContent = r.error;
          li.append(err);
        }
        list.append(li);
      }
      const failed = results.filter((r) => !r.ok).length;
      summary.textContent = failed
        ? `${failed} av ${results.length} tester underkända.`
        : `Alla ${results.length} tester godkända.`;
      summary.className = `tests-summary ${failed ? 'is-fail' : 'is-pass'}`;
      document.title = `Tentaplugget – tester (${failed ? 'underkända finns' : 'alla godkända'})`;
    </script>
  </body>
</html>
